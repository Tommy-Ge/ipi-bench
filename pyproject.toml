[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ipibench"
version = "0.1.0"
description = "Indirect prompt injection benchmark: 500+ injections hidden in logs, emails and web pages, plus an evaluation harness for LLM defenses."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "openai>=1.40",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "joblib>=1.3",
  "matplotlib>=3.8",
  "tqdm>=4.66",
]

[project.optional-dependencies]
hf = ["transformers>=4.44", "torch>=2.3"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
ipibench = "ipibench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ipibench"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
